name: portscan
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: install
        run: |
          sudo apt-get update -qq >/dev/null 2>&1 || true
          sudo apt-get install -y -qq nmap netcat-openbsd >/dev/null 2>&1 || true
          nmap --version | head -1
      - name: scan
        run: |
          set -x
          mkdir -p results
          TARGETS="188.245.59.121 188.34.186.195 142.132.190.176 49.13.213.201 49.13.15.227 46.224.8.127 5.161.255.2 65.109.253.170 49.12.37.78 46.224.50.160 167.235.109.203"
          for ip in $TARGETS; do
            echo "=== $ip ==="
            sudo nmap -n -Pn -sS --min-rate 2500 --max-retries 1 --host-timeout 480s -p- "$ip" -oN "results/$ip.nmap" >/dev/null 2>&1 || true
            grep -E '^[0-9]+/tcp' "results/$ip.nmap" | grep -v closed || true
          done
      - name: serviceversion
        run: |
          for f in results/*.nmap; do
            ip=$(basename "$f" .nmap)
            ports=$(grep -E '^[0-9]+/tcp' "$f" | grep open | cut -d/ -f1 | paste -sd, -)
            [ -z "$ports" ] && continue
            echo "=== $ip sV ports=$ports"
            sudo nmap -n -Pn -sT -sV --version-light --max-retries 1 --host-timeout 240s -p "$ports" "$ip" -oN "results/$ip.sv" >/dev/null 2>&1 || true
            grep -E '^[0-9]+/tcp' "results/$ip.sv" | grep open || true
          done
      - name: banner
        run: |
          cat > probe.py <<'PY'
          import socket, time, os
          targets = """188.245.59.121 188.34.186.195 142.132.190.176 49.13.213.201 49.13.15.227 46.224.8.127 5.161.255.2 65.109.253.170 49.12.37.78 46.224.50.160 167.235.109.203""".split()
          out = open('results/banners.txt','w')
          for ip in targets:
              fn = f'results/{ip}.nmap'
              if not os.path.exists(fn): continue
              ports = []
              for line in open(fn):
                  parts = line.split()
                  if parts and parts[0].endswith('/tcp') and 'open' in line:
                      ports.append(int(parts[0].split('/')[0]))
              for p in ports:
                  s = socket.socket(); s.settimeout(4)
                  rec = ''
                  try:
                      s.connect((ip,p))
                      if p in (6379,11211): s.sendall(b'INFO\r\n' if p==6379 else b'stats\r\n')
                      elif p in (80,8080,8081,3000,1880,9000,9200,2375,2376,8000,5000,10250): s.sendall(b'GET / HTTP/1.0\r\nHost: x\r\n\r\n')
                      elif p==5432: pass
                      elif p==3306: pass
                      elif p==22: pass
                      time.sleep(0.7)
                      try: rec = s.recv(600)
                      except Exception: rec = b''
                  except Exception as e:
                      rec = ('ERR '+repr(e)).encode()
                  finally:
                      s.close()
                  line = f'{ip}:{p} -> {rec[:400]!r}'
                  print(line); out.write(line+'\n'); out.flush()
          out.close()
          PY
          python3 probe.py
      - name: commit
        if: always()
        run: |
          git config user.name probe; git config user.email probe@users.noreply.github.com
          git add -A results || true
          git commit -m "scan results $(date -u +%s)" || true
          git push || true
